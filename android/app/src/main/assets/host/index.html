<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saath</title>
<style>
:root{
  /* Host app: one night palette; marigold accent; full-height column with a bottom tab bar during a party */
  --bg:#11141F; --card:#1A1F2E; --card2:#242A3D; --line:#2F3651; --ink:#F2F4FA; --muted:#9AA2BA;
  --accent:#F5A524; --accent-ink:#1B1200; --good:#3DD6A8; --warn:#FF9A5C; --bad:#FF5A73;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}
.content{flex:1;overflow-y:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border-radius:16px;padding:14px;display:grid;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;background:var(--card2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.good{background:rgba(61,214,168,.15);color:var(--good)}
.chip.warn{background:rgba(255,154,92,.15);color:var(--warn)}
.chip.bad{background:rgba(255,90,115,.16);color:var(--bad)}
.chip.neutral{background:var(--card2);color:var(--muted)}
.note{display:flex;gap:8px;font-size:13px;border-radius:12px;padding:10px 12px;line-height:1.4}
.note.warn{background:rgba(255,154,92,.12)}
.note.bad{background:rgba(255,90,115,.13)}
.note.good{background:rgba(61,214,168,.12)}
.note.info{background:var(--card2);color:var(--muted)}
.note b{color:var(--ink)}
.home{justify-content:center;align-items:center;text-align:center;gap:26px}
.logo{width:68px;height:68px;margin:0 auto 12px;color:var(--accent)}
.wordmark{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1}
.start{width:172px;height:172px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;font-weight:800;box-shadow:0 0 0 10px rgba(245,165,36,.16),0 0 0 22px rgba(245,165,36,.07)}
.how{list-style:none;padding:0;margin:0;display:grid;gap:6px;color:var(--muted);font-size:14px}
.how b{color:var(--ink)}
.topbar{display:flex;align-items:center;gap:10px;min-height:40px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--card2);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.mode{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:16px;display:grid;gap:6px;color:var(--ink);width:100%}
.mode.suggested{border-color:var(--accent)}
.mode:disabled{opacity:.5}
.mode .t{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px}
.badge{background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px}
.phead{flex:none;padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.live{display:flex;align-items:center;gap:8px;font-weight:800}
.live i{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(61,214,168,.22)}
.live.off i{background:var(--warn);box-shadow:0 0 0 4px rgba(255,154,92,.22)}
.endbtn{border:0;background:transparent;color:var(--bad);font-weight:800;font-size:14px;padding:8px 4px}
.endq{display:flex;gap:6px;align-items:center;font-size:13px}
.endq button{border:0;border-radius:8px;padding:7px 10px;font-weight:800;font-size:13px}
.endq .yes{background:var(--bad);color:#fff}
.endq .no{background:var(--card2)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12.5px;font-weight:700;position:relative}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .dot{position:absolute;top:4px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--warn)}
.qr-card{justify-items:center;text-align:center}
.qr-head{display:flex;gap:10px;align-items:center;justify-self:stretch;text-align:left}
.stepn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.qr{background:#fff;border-radius:14px;padding:10px;line-height:0}
.qr svg{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;justify-self:stretch;text-align:left;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all;font-variant-numeric:tabular-nums}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle .tt{display:grid;gap:2px}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw input:checked+span{background:var(--accent);border-color:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px);background:var(--accent-ink)}
.pin{font-size:30px;font-weight:800;letter-spacing:.3em;color:var(--accent);font-variant-numeric:tabular-nums}
.big{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--muted);font-weight:700}
.st{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.list{display:grid;gap:2px;background:var(--card);border-radius:16px;padding:4px}
.dev{display:grid;grid-template-columns:36px 1fr auto auto;gap:10px;align-items:center;padding:9px 8px 9px 10px;border-radius:12px}
.dev.active{background:var(--card2)}
.di{width:36px;height:36px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.di svg{width:19px;height:19px}
.dn{font-weight:700;line-height:1.25}
.ds{font-size:12px;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:9px 6px;background:transparent;color:var(--muted);font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink)}
.seg small{display:block;font-weight:500;font-size:11.5px}
.trk{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:0;background:transparent;text-align:left;width:100%}
.trk.on{background:var(--card2)}
.art{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:var(--accent-ink);background:var(--accent)}
.trk .tt{display:block;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .ta{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .td{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.search{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.search:focus{border-color:var(--accent);outline:none}
.ctrl{display:flex;justify-content:center;align-items:center;gap:22px}
.ctrl button{border:0;background:transparent;display:grid;place-items:center}
.ctrl .pp{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.ctrl svg{width:24px;height:24px}
.seek{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek input,.range{width:100%;accent-color:var(--accent)}
.meter{height:8px;border-radius:8px;background:var(--card2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);width:0;transition:width .2s}
.mini{flex:none;margin:0 10px 8px;background:var(--card2);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.mini .mt{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:12px;color:var(--muted)}
.mini .mb{grid-row:1 / 3;grid-column:2;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mini .mb svg{width:20px;height:20px}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;color:var(--muted);font-weight:700}
.field input{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.update{background:rgba(245,165,36,.14);border-radius:14px;padding:12px;display:grid;gap:8px;text-align:left;width:100%}
.mic{display:flex;gap:3px;align-items:flex-end;height:26px}
.mic span{flex:1;background:var(--accent);border-radius:2px;animation:mic 0.9s ease-in-out infinite}
.mic span:nth-child(2n){animation-delay:-.3s}.mic span:nth-child(3n){animation-delay:-.6s}
@keyframes mic{0%,100%{height:15%}50%{height:90%}}
@media (prefers-reduced-motion: reduce){.mic span{animation:none;height:50%}}
.toast{position:fixed;left:16px;right:16px;bottom:90px;background:#F4F5F8;color:#16181D;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="qrcode.js"></script>
<script>
(() => {
'use strict';
const N = window.Native || mockNative();
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { const s = Math.max(0, Math.floor((ms || 0) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const I = {
  logo: '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><circle cx="22" cy="32" r="6" fill="currentColor" stroke="none"/><circle cx="42" cy="32" r="6" fill="currentColor" stroke="none"/><path d="M12 20a18 18 0 0 0 0 24"/><path d="M52 20a18 18 0 0 1 0 24"/><path d="M5 13a28 28 0 0 0 0 38"/><path d="M59 13a28 28 0 0 1 0 38"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0"/><path d="M5.5 12.5a9.5 9.5 0 0 1 13 0"/><path d="M8.7 15.9a5 5 0 0 1 6.6 0"/><circle cx="12" cy="19.3" r="1.3" fill="currentColor" stroke="none"/></svg>',
  hotspot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M8.5 15.5a5 5 0 0 1 0-7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.6 18.4a9 9 0 0 1 0-12.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.7-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.6v12.8a.9.9 0 0 0 1.4.74L15.5 13a1.2 1.2 0 0 0 0-2L6.4 4.86A.9.9 0 0 0 5 5.6z"/><rect x="16.5" y="5" width="2.6" height="14" rx="1"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 5.6v12.8a.9.9 0 0 1-1.4.74L8.5 13a1.2 1.2 0 0 1 0-2l9.1-6.14A.9.9 0 0 1 19 5.6z"/><rect x="4.9" y="5" width="2.6" height="14" rx="1"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.2"/><path d="M14 14h3v3h-3zM17.5 17.5h3v3h-3z" fill="currentColor" stroke="none"/></svg>',
  devices: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="12" height="9" rx="1.5"/><path d="M1.5 17.5h14"/><rect x="16.5" y="7" width="5.5" height="12" rx="1.4"/></svg>',
  music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 17.5V5.5l11-2v12"/><circle cx="6.5" cy="17.5" r="2.6"/><circle cx="17.5" cy="15.5" r="2.6"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3" stroke-linecap="round"/></svg>',
  laptop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="5" width="16" height="10.5" rx="1.5"/><path d="M2 19h20"/></svg>',
  host: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10 9.5l4 2.5-4 2.5z" fill="currentColor" stroke="none"/></svg>'
};

let S = {};              // last state from the app
let songs = null;        // music list
let ui = {screen: 'home', tab: 'invite', confirmEnd: false, query: '', seeking: false, ownSsid: '', ownPass: ''};

/* ---------- native bridge ---------- */
function call(name, ...args) {
  try { const r = N[name](...args.map(a => typeof a === 'object' ? JSON.stringify(a) : a)); return r; }
  catch (e) { console.error('native call failed', name, e); return null; }
}
window.onNative = json => {
  try { S = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { return; }
  if (S.running && ui.screen !== 'party') ui.screen = 'party';
  if (!S.running && ui.screen === 'party') { ui.screen = 'home'; ui.confirmEnd = false; }
  render();
};
window.onNativeEvent = json => {
  let e; try { e = typeof json === 'string' ? JSON.parse(json) : json; } catch (x) { return; }
  if (e.type === 'toast') toast(e.text);
  if (e.type === 'songs') { songs = null; loadSongs(); }
};
let toastTimer = null;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3800); }
function loadSongs() { const r = call('songs'); try { songs = JSON.parse(r || '[]'); } catch (e) { songs = []; } render(); }

/* ---------- rendering ---------- */
function qrSvg(text, size) {
  if (typeof qrcode !== 'function') return '';
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
  return '<svg viewBox="0 0 ' + n + ' ' + n + '" width="' + size + '" height="' + size + '" shape-rendering="crispEdges" role="img" aria-label="QR code"><path d="' + d + '" fill="#111"/></svg>';
}
function wifiQR(ssid, pass) { const e = s => s.replace(/([\\;,:"])/g, '\\$1'); return 'WIFI:T:WPA;S:' + e(ssid) + ';P:' + e(pass) + ';;'; }

function homeHTML() {
  const u = S.update;
  let up = '';
  if (u && u.available) {
    const st = u.state;
    up = '<div class="update"><b>Update available: version ' + esc(u.version) + '</b>' + (u.notes ? '<span class="small muted">' + esc(u.notes) + '</span>' : '') +
      (st === 'downloading' ? '<div class="meter"><i style="width:' + Math.round((u.progress || 0) * 100) + '%"></i></div><span class="small muted">Downloading…</span>'
        : st === 'installing' ? '<span class="small muted">Installing…</span>'
        : st === 'failed' ? '<span class="small" style="color:var(--bad)">' + esc(u.error || 'The update failed.') + '</span><button class="btn primary" data-act="update">Try again</button>'
        : '<button class="btn primary" data-act="update">Update now</button>') + '</div>';
  }
  return '<div class="content home">' + up +
    '<div><div class="logo">' + I.logo + '</div><div class="wordmark">Saath</div><p class="muted" style="margin-top:8px">Your friends’ phones become your speaker.</p></div>' +
    '<button class="start" data-act="go-mode">Start party</button>' +
    '<ul class="how"><li><b>Start</b> a party here</li><li>Friends <b>scan</b> your QR code</li><li>Every device <b>plays</b> in sync</li></ul>' +
    '<p class="small muted">Version ' + esc(S.version || '') + '</p></div>';
}

function modeHTML() {
  const wifi = !!S.wifiIp;
  return '<div class="content"><div class="topbar"><button class="icon-btn" data-act="go-home" aria-label="Back">' + I.back + '</button><h2>Where’s the party?</h2></div>' +
    '<button class="mode' + (wifi ? ' suggested' : '') + '" data-act="start" data-arg="online"' + (wifi ? '' : ' disabled') + '><span class="t">' + I.wifi.replace('<svg', '<svg width="22" height="22"') + (wifi ? '<span class="badge">Suggested</span>' : '') + '</span>' +
      '<b>Online · same Wi-Fi</b><span class="small muted">' + (wifi ? 'Everyone joins the Wi-Fi this phone is on. Friends keep their internet. One QR code.' : 'Connect this phone to Wi-Fi first.') + '</span></button>' +
    '<button class="mode' + (wifi ? '' : ' suggested') + '" data-act="start" data-arg="quick"><span class="t">' + I.hotspot.replace('<svg', '<svg width="22" height="22"') + (wifi ? '' : '<span class="badge">Suggested</span>') + '</span>' +
      '<b>Offline · quick hotspot</b><span class="small muted">This phone makes its own Wi-Fi. No internet needed. Friends scan two QR codes.</span></button>' +
    '<button class="mode" data-act="start" data-arg="own"><span class="t">' + I.hotspot.replace('<svg', '<svg width="22" height="22"') + '</span>' +
      '<b>Offline · my hotspot</b><span class="small muted">Use the hotspot from Settings. Friends also get your mobile data.</span></button>' +
    '<p class="small muted">Audio stays on this network. Nothing goes to the cloud.</p></div>';
}

function partyHTML() {
  const P = S.party || {};
  const devs = (P.devices || []).filter(d => d.connected);
  const needTune = devs.some(d => d.ready && !d.tuned);
  const modeLabel = S.mode === 'online' ? 'Online · same Wi-Fi' : S.mode === 'quick' ? 'Offline · ' + (S.hotspot && S.hotspot.ssid ? S.hotspot.ssid : 'quick hotspot') : 'Offline · my hotspot';
  const ok = !!S.ip;
  const head = '<div class="phead"><div><div class="live' + (ok ? '' : ' off') + '"><i></i>' + (ok ? 'Party is live' : 'Waiting for network') + '</div><div class="small muted">' + esc(modeLabel) + '</div></div>' +
    (ui.confirmEnd ? '<div class="endq">End for everyone?<button class="yes" data-act="end-yes">End</button><button class="no" data-act="end-no">Keep</button></div>' : '<button class="endbtn" data-act="end">End party</button>') + '</div>';
  let c = ui.tab === 'invite' ? inviteHTML() : ui.tab === 'devices' ? devicesHTML() : musicHTML();
  const n = S.now || {};
  let mini = '';
  if (n.title && ui.tab !== 'music') {
    mini = '<div class="mini"><div class="mt">' + esc(n.title) + '</div><div class="ms">' + esc(n.sub || '') + ' · ' + (devs.length + (P.hostSpeaker ? 1 : 0)) + ' speakers</div>' +
      (S.source === 'files' ? '<button class="mb" data-act="toggle" aria-label="' + (n.playing ? 'Pause' : 'Play') + '">' + (n.playing ? I.pause : I.play) + '</button>' : '') + '</div>';
  }
  const tab = (id, label, icon, dot) => '<button data-act="tab" data-arg="' + id + '"' + (ui.tab === id ? ' aria-current="page"' : '') + '>' + icon + label + (dot ? '<span class="dot"></span>' : '') + '</button>';
  return head + '<div class="content">' + c + '</div>' + mini +
    '<nav class="tabs">' + tab('invite', 'Invite', I.qr) + tab('devices', 'Devices' + (devs.length ? ' (' + devs.length + ')' : ''), I.devices, needTune && ui.tab !== 'devices') + tab('music', 'Music', I.music) + '</nav>';
}

function inviteHTML() {
  const P = S.party || {};
  let h = '';
  if (!S.ip) {
    if (S.mode === 'quick') {
      const hs = S.hotspot || {};
      h += hs.state === 'failed'
        ? '<div class="note bad"><span><b>Couldn’t start the quick hotspot.</b> ' + esc(hs.error || '') + ' Try “my hotspot” instead: end this party and pick it.</span></div>'
        : '<div class="note info"><span>Starting the hotspot…</span></div>';
    } else if (S.mode === 'own') {
      h += '<div class="card"><h3>Turn on your hotspot</h3><p class="small muted">Open Settings, turn on Mobile hotspot, then come back here. The QR code appears as soon as the hotspot is on.</p><button class="btn primary" data-act="hotspot-settings">Open hotspot settings</button></div>';
    } else {
      h += '<div class="note warn"><span><b>This phone isn’t on Wi-Fi.</b> Connect to Wi-Fi, or end the party and start an offline one.</span></div>';
    }
    return h;
  }
  const link = S.link;
  if (S.mode === 'quick' && S.hotspot && S.hotspot.ssid) {
    h += qrCard('1', 'Join this phone’s Wi-Fi', 'Friends point their camera here first', wifiQR(S.hotspot.ssid, S.hotspot.pass || ''), [['Network', S.hotspot.ssid], ['Password', S.hotspot.pass || '']]);
    h += qrCard('2', 'Open the party page', 'Then scan this one', link, [['Link', link]]);
    h += '<div class="note info"><span>This hotspot has no internet, so Android may ask friends “Stay connected?”. They tap yes. If the page won’t open, they turn off mobile data.</span></div>';
  } else if (S.mode === 'own') {
    const ssid = S.ownHotspot && S.ownHotspot.ssid, pass = S.ownHotspot && S.ownHotspot.pass;
    if (ssid) h += qrCard('1', 'Join this phone’s hotspot', 'Friends point their camera here first', wifiQR(ssid, pass || ''), [['Network', ssid], ['Password', pass || '(none)']]);
    h += qrCard(ssid ? '2' : '✓', 'Open the party page', ssid ? 'Then scan this one' : 'Friends join your hotspot, then scan this', link, [['Link', link]]);
    h += '<details class="card"><summary class="small" style="cursor:pointer;font-weight:700">' + (ssid ? 'Change the hotspot QR code' : 'Add a QR code for joining your hotspot') + '</summary>' +
      '<div class="field"><label for="own-ssid">Hotspot name</label><input id="own-ssid" value="' + esc(ssid || '') + '" autocomplete="off"></div>' +
      '<div class="field"><label for="own-pass">Hotspot password</label><input id="own-pass" value="' + esc(pass || '') + '" autocomplete="off"></div>' +
      '<button class="btn" data-act="own-save">Save</button><p class="small muted">Find these in Settings › Mobile hotspot. They stay on this phone.</p></details>';
  } else {
    h += qrCard('✓', 'Scan to join', 'Friends on the same Wi-Fi open the party page', link, [['Link', link]]);
  }
  h += '<div class="row2"><button class="btn" data-act="copy">Copy link</button><button class="btn" data-act="share">Share link</button></div>';
  h += '<div class="card"><div class="toggle"><div class="tt"><b>Party PIN</b><span class="small muted">Ask for a 4-digit code before joining</span></div><label class="sw"><input type="checkbox" data-change="pin" aria-label="Party PIN"' + (P.pinRequired ? ' checked' : '') + '><span></span></label></div>' +
    (P.pinRequired ? '<div class="pin">' + esc(P.pin) + '</div>' : '') + '</div>';
  if (S.ips && S.ips.length > 1) h += '<p class="small muted">Other addresses for this phone: ' + S.ips.filter(x => x !== S.ip).map(esc).join(', ') + '</p>';
  h += '<p class="small muted">Friends install nothing. Android and iPhone cameras both open these codes.</p>';
  return h;
}
function qrCard(n, title, sub, data, kv) {
  return '<div class="card qr-card"><div class="qr-head"><span class="stepn">' + n + '</span><div><h3>' + esc(title) + '</h3><span class="small muted">' + esc(sub) + '</span></div></div>' +
    '<div class="qr">' + qrSvg(data, 190) + '</div><dl class="kv">' + kv.map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl></div>';
}

function devStatus(d, P) {
  const t = P.tuning;
  if (t && t.name === d.name) return '<span class="chip warn">Listening…</span>';
  if (!d.connected) return '<span class="chip neutral">Left</span>';
  if (!d.ready) return '<span class="chip neutral">Syncing clock…</span>';
  if (d.failed) return '<span class="chip bad">Couldn’t hear it</span>';
  if (typeof d.measured === 'number') {
    const v = d.measured, s = (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + ' ms';
    return '<span class="chip ' + (Math.abs(v) <= 10 ? 'good' : Math.abs(v) <= 15 ? 'warn' : 'bad') + '">' + (d.tuned && Math.abs(v) <= 10 ? '✓ ' : '') + s + '</span>';
  }
  return '<span class="chip warn">Not tuned</span>';
}
function summary(P) {
  const devs = (P.devices || []).filter(d => d.connected && d.ready);
  if (!devs.length) return {cls: 'neutral', big: '—', unit: '', chip: 'No listeners', text: 'Friends join from the Invite tab.'};
  const vals = devs.filter(d => typeof d.measured === 'number').map(d => d.measured);
  if (P.hostSpeaker && typeof P.hostMeasured === 'number') vals.push(P.hostMeasured);
  const unmeasured = devs.filter(d => typeof d.measured !== 'number');
  if (!vals.length) return {cls: 'warn', big: 'Not tuned', unit: '', chip: 'Echo likely', text: 'Every speaker has its own hidden delay. Tune up to line them up.'};
  const gap = vals.length > 1 ? Math.max(...vals) - Math.min(...vals) : 0;
  if (unmeasured.length) return {cls: 'warn', big: gap.toFixed(1), unit: 'ms', chip: unmeasured.length + ' not tuned', text: unmeasured.map(d => d.name).join(', ') + ' joined after the last tune-up.'};
  if (gap <= 10) return {cls: 'good', big: gap.toFixed(1), unit: 'ms', chip: 'In sync', text: 'Every speaker is within ' + Math.max(1, Math.ceil(gap)) + ' ms. Heard as one sound.'};
  if (gap <= 15) return {cls: 'warn', big: gap.toFixed(1), unit: 'ms', chip: 'Close', text: 'Tune up again to get this under 10 ms.'};
  return {cls: 'bad', big: Math.round(gap), unit: 'ms', chip: 'Echo', text: 'More than 15 ms apart, which sounds like an echo. Tap Tune up.'};
}
function devicesHTML() {
  const P = S.party || {};
  const s = summary(P);
  let h = '<div class="card"><div class="st"><div><div class="small muted">Gap between speakers</div><div class="big">' + esc(s.big) + (s.unit ? ' <small>' + s.unit + '</small>' : '') + '</div></div><span class="chip ' + s.cls + '">' + esc(s.chip) + '</span></div><p class="small muted">' + esc(s.text) + '</p>';
  if (P.tuning) {
    const t = P.tuning;
    h += '<div class="note warn"><span><b>' + (t.mode === 'tune' ? (t.phase === 'verifying' ? 'Checking the result' : 'Tuning') : 'Checking') + ' ' + (Math.min(t.idx, t.total - 1) + 1) + ' of ' + t.total + (t.name ? ': ' + esc(t.name) : '') + '</b><br>The microphone is listening for each chirp. Keep devices within 1 m and quiet the room for a few seconds.</span></div>' +
      '<div class="mic" aria-hidden="true">' + '<span></span>'.repeat(20) + '</div>';
  } else {
    const can = (P.devices || []).some(d => d.connected && d.ready);
    h += '<div class="row2"><button class="btn primary" data-act="tune"' + (can ? '' : ' disabled') + '>Tune up</button><button class="btn" data-act="check"' + (can ? '' : ' disabled') + '>Sync check</button></div>';
    if (P.lastTune) h += '<p class="small muted">' + esc(P.lastTune) + '</p>';
  }
  h += '</div><div class="list">';
  const hostChip = !P.hostSpeaker ? '<span class="chip neutral">Silent DJ</span>' : (P.tuning && P.tuning.name === 'This phone') ? '<span class="chip warn">Listening…</span>' : typeof P.hostMeasured === 'number' ? '<span class="chip good">Reference</span>' : '<span class="chip neutral">Reference</span>';
  h += '<div class="dev"><span class="di">' + I.host + '</span><span><div class="dn">This phone</div><div class="ds">Host · ' + (P.hostSpeaker ? 'plays too' : 'speaker off') + '</div></span>' + hostChip + '<span></span></div>';
  for (const d of (P.devices || [])) {
    if (!d.connected) continue;
    h += '<div class="dev' + (P.tuning && P.tuning.name === d.name ? ' active' : '') + '"><span class="di">' + (d.kind === 'laptop' ? I.laptop : I.phone) + '</span><span><div class="dn">' + esc(d.name) + '</div><div class="ds">' +
      (d.kind === 'laptop' ? 'Laptop' : d.kind === 'iphone' ? 'iPhone' : 'Phone') + (d.rtt > 0 ? ' · ' + Math.round(d.rtt) + ' ms network' : '') + (d.late > 0 ? ' · ' + d.late + ' late' : '') + '</div></span>' +
      devStatus(d, P) + '<button class="x" data-act="kick" data-arg="' + esc(d.cid) + '" aria-label="Remove ' + esc(d.name) + '">×</button></div>';
  }
  h += '</div>';
  if (!(P.devices || []).some(d => d.connected)) h += '<p class="empty">No one has joined yet. Show friends the QR code on the Invite tab.</p>';
  h += '<div class="card"><div class="toggle"><div class="tt"><b>Play on this phone too</b><span class="small muted">' +
    (S.source === 'app' ? 'Off is best for Any App: the music app already plays here live, about 0.8 s ahead of everyone.' : 'Off makes this phone a silent DJ.') + '</span></div>' +
    '<label class="sw"><input type="checkbox" data-change="host-speaker" aria-label="Play on this phone too"' + (P.hostSpeaker ? ' checked' : '') + '><span></span></label></div></div>';
  return h;
}

function musicHTML() {
  let h = '<div class="seg" role="group" aria-label="Music source"><button data-act="source" data-arg="files" aria-pressed="' + (S.source === 'files') + '">My Music<small>songs on this phone</small></button>' +
    '<button data-act="source" data-arg="app" aria-pressed="' + (S.source === 'app') + '">Any App<small>Spotify, YouTube Music…</small></button></div>';
  const n = S.now || {};
  if (S.source === 'files') {
    if (n.title) {
      h += '<div class="card"><div><div class="dn" style="font-size:18px">' + esc(n.title) + '</div><div class="small muted">' + esc(n.sub || '') + '</div></div>' +
        '<div class="seek"><span id="pos">' + fmt(n.posMs) + '</span><input type="range" id="seek" min="0" max="' + Math.max(1, n.durMs || 1) + '" value="' + (n.posMs || 0) + '" data-change="seek" aria-label="Seek"><span>' + fmt(n.durMs) + '</span></div>' +
        '<div class="ctrl"><button data-act="prev" aria-label="Previous">' + I.prev + '</button><button class="pp" data-act="toggle" aria-label="' + (n.playing ? 'Pause' : 'Play') + '">' + (n.playing ? I.pause : I.play) + '</button><button data-act="next" aria-label="Next">' + I.next + '</button></div></div>';
    }
    if (!(S.perm && S.perm.music)) h += '<div class="card"><h3>Show your songs</h3><p class="small muted">Saath needs permission to see the music files on this phone.</p><button class="btn primary" data-act="perm-music">Allow access to music</button></div>';
    if (songs === null) loadSongs();
    const list = (songs || []).filter(s => !ui.query || (s.title + ' ' + s.artist).toLowerCase().includes(ui.query.toLowerCase()));
    if ((songs || []).length > 8) h += '<input class="search" id="q" type="search" placeholder="Search songs" value="' + esc(ui.query) + '" data-input="q" aria-label="Search songs">';
    h += '<div class="list">' + list.slice(0, 400).map(s => '<button class="trk' + (n.id === s.id ? ' on' : '') + '" data-act="play" data-arg="' + esc(s.id) + '"><span class="art">' + esc((s.title || '?').charAt(0).toUpperCase()) + '</span><span style="min-width:0"><span class="tt">' + esc(s.title) + '</span><span class="ta">' + esc(s.artist || '') + '</span></span><span class="td">' + fmt(s.dur) + '</span></button>').join('') + '</div>';
    if (songs && songs.length <= 1 && S.perm && S.perm.music) h += '<p class="empty">No songs found in this phone’s music library. The test beat still works.</p>';
    h += '<p class="small muted">Friends hear each song about 1 second after you tap, all at the same moment.</p>';
  } else {
    const c = S.capture || {};
    if (!c.on) {
      h += '<div class="card"><h3>Share audio from any app</h3><p class="small muted">Play music in Spotify, YouTube Music or another app. Saath copies the sound and sends it to every device in sync.</p><button class="btn primary block" data-act="capture-start">Start sharing</button></div>' +
        '<div class="note info"><span>Android asks for permission each time sharing starts. Apps like Netflix block sharing; their sound stays on this phone.</span></div>';
    } else {
      h += '<div class="card"><div class="toggle"><div class="tt"><b>Sharing this phone’s audio</b><span class="small muted">Open your music app and press play. Control songs there.</span></div><span class="chip good">Live</span></div>' +
        '<div class="meter"><i id="meter" style="width:' + Math.min(100, Math.round((c.peak || 0) * 140)) + '%"></i></div>' +
        (c.silentS >= 6 ? '<div class="note warn"><span><b>No sound for ' + Math.round(c.silentS) + ' s.</b> If music is playing, that app may block sharing. Try Spotify or YouTube Music.</span></div>' : '') +
        '<button class="btn block" data-act="capture-stop">Stop sharing</button></div>';
    }
  }
  return h;
}

const last = {html: ''};
function render() {
  let html;
  if (ui.screen === 'party' && S.running) html = partyHTML();
  else if (ui.screen === 'mode') html = modeHTML();
  else html = homeHTML();
  const app = $('#app');
  if (html === last.html) return;
  const sc = app.querySelector('.content'), top = sc ? sc.scrollTop : 0;
  const a = document.activeElement, aid = a && a.id && app.contains(a) ? a.id : null, sel = a && 'selectionStart' in a ? a.selectionStart : null;
  if (ui.seeking && a && a.id === 'seek') return;
  app.innerHTML = html; last.html = html;
  const sc2 = app.querySelector('.content'); if (sc2) sc2.scrollTop = top;
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus({preventScroll: true}); try { if (sel !== null && el.setSelectionRange) el.setSelectionRange(sel, sel); } catch (e) {} } }
}

/* ---------- events ---------- */
const ACT = {
  'go-mode': () => { ui.screen = 'mode'; },
  'go-home': () => { ui.screen = 'home'; },
  'start': m => { call('startParty', m); ui.tab = 'invite'; },
  'end': () => { ui.confirmEnd = true; },
  'end-no': () => { ui.confirmEnd = false; },
  'end-yes': () => { ui.confirmEnd = false; call('endParty'); },
  'tab': t => { ui.tab = t; if (t === 'music' && songs === null) loadSongs(); },
  'tune': () => call('tune'),
  'check': () => call('check'),
  'kick': id => call('kick', id),
  'play': id => call('play', id),
  'toggle': () => call('toggle'),
  'next': () => call('next'),
  'prev': () => call('prev'),
  'source': s => call('setSource', s),
  'capture-start': () => call('startCapture'),
  'capture-stop': () => call('stopCapture'),
  'perm-music': () => call('requestMusicPermission'),
  'copy': () => { call('copy', S.link || ''); toast('Link copied'); },
  'share': () => call('shareLink'),
  'hotspot-settings': () => call('openHotspotSettings'),
  'own-save': () => { const s = $('#own-ssid'), p = $('#own-pass'); call('setOwnHotspot', s ? s.value.trim() : '', p ? p.value : ''); },
  'update': () => call('installUpdate')
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  f(b.dataset.arg); last.html = ''; render();
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset && t.dataset.change; if (!k) return;
  if (k === 'pin') call('setPin', t.checked);
  else if (k === 'host-speaker') call('setHostSpeaker', t.checked);
  else if (k === 'seek') { ui.seeking = false; call('seek', +t.value); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'seek') { ui.seeking = true; const p = $('#pos'); if (p) p.textContent = fmt(+t.value); }
  if (t.dataset && t.dataset.input === 'q') { ui.query = t.value; render(); }
});
window.addEventListener('popstate', () => {});
window.saathBack = () => { // Android back button
  if (ui.screen === 'mode') { ui.screen = 'home'; render(); return true; }
  if (ui.screen === 'party' && ui.tab !== 'invite') { ui.tab = 'invite'; render(); return true; }
  return false;
};

/* ---------- browser preview without the app ---------- */
function mockNative() {
  const st = {version: '0.0.0-preview', running: false, wifiIp: '192.168.1.37', source: 'files', perm: {music: true, mic: true}, now: {}, party: {devices: [], pin: '4827'}};
  const push = () => setTimeout(() => window.onNative(JSON.stringify(st)), 0);
  return {
    state: () => JSON.stringify(st),
    songs: () => JSON.stringify([{id: 'beat', title: 'Sync test beat', artist: 'Built in', dur: 180000}]),
    startParty: m => { st.running = true; st.mode = m; st.ip = m === 'online' ? '192.168.1.37' : '192.168.43.1'; st.link = 'http://' + st.ip + ':8080/j/ABC123'; st.hotspot = {state: 'on', ssid: 'AndroidShare_1234', pass: 'k8x2m9qp'}; push(); },
    endParty: () => { st.running = false; push(); },
    play: () => { st.now = {id: 'beat', title: 'Sync test beat', sub: 'Built in', playing: true, posMs: 0, durMs: 180000}; push(); },
    toggle: () => { st.now.playing = !st.now.playing; push(); }, next: () => {}, prev: () => {}, seek: () => {},
    setSource: s => { st.source = s; push(); }, startCapture: () => { st.capture = {on: true, peak: 0.3, silentS: 0}; push(); }, stopCapture: () => { st.capture = {on: false}; push(); },
    tune: () => {}, check: () => {}, kick: () => {}, setPin: v => { st.party.pinRequired = v === true || v === 'true'; push(); }, setHostSpeaker: () => {},
    requestMusicPermission: () => {}, copy: () => {}, shareLink: () => {}, openHotspotSettings: () => {}, setOwnHotspot: () => {}, installUpdate: () => {}
  };
}

try { window.onNative(N.state()); } catch (e) { render(); }
})();
</script>
