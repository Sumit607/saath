name: Build, test and release

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  core:
    name: Core + listener tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Core unit tests
        run: ./tools/test-core.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chrome
        run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Three browser listeners against the desktop host
        run: python tools/e2e/e2e_listeners.py

  build:
    name: Build APK
    needs: core
    runs-on: ubuntu-latest
    env:
      SAATH_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release and debug APKs
        run: gradle -p android assembleRelease assembleDebug --no-daemon --stacktrace
      - name: Collect APKs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk saath.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk saath-debug.apk
          ls -l saath*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            saath.apk
            saath-debug.apk

  emulator:
    name: Emulator test (real app, real browsers)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chrome
        run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Run the app on Android 14 and join it from three browsers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/emulator-test.sh

  release:
    name: Publish update
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Write version.json
        env:
          VC: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          export NOTES="$(git log -1 --pretty=%s)"
          python3 -c "import json,os; vc=int(os.environ['VC']); json.dump({'versionCode': vc, 'versionName': '1.0.%d' % vc, 'apk': 'https://github.com/%s/releases/download/v1.0.%d/saath.apk' % (os.environ['REPO'], vc), 'notes': os.environ['NOTES'][:200]}, open('version.json','w'))"
          cat version.json
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VC: ${{ github.run_number }}
        run: |
          gh release create "v1.0.$VC" saath.apk version.json \
            --title "Saath 1.0.$VC" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
